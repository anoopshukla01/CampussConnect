<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campuss Connect — Unified Campus Ecosystem</title>
    <meta name="description" content="Campuss Connect — your unified campus ecosystem for academics, community, and placement." />
    
    <!-- PWA configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Campuss Connect" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Only register service worker in web browsers, never inside native APK WebView
      if ('serviceWorker' in navigator && !window.Capacitor?.isNativePlatform()) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          // If we are on native or troubleshooting, unregister stale workers
          if (window.location.search.includes('clear-sw=1')) {
            for (let reg of registrations) { reg.unregister(); }
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              // Automatically check for updates
              reg.update();
            })
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
